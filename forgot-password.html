<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Alpha Freshman Tutorial</title>
    <link rel="stylesheet" href="elearning.css">
    <meta name="theme-color" content="#3B82F6">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="home.html" class="logo-container">
                <span class="platform-name">Alpha Freshman Tutorial</span>
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card" style="max-width:420px">

            <!-- Icon -->
            <div style="text-align:center;margin-bottom:16px">
                <div style="font-size:3.5rem">🔐</div>
            </div>

            <h2 style="text-align:center">Forgot Password?</h2>
            <p class="auth-subtitle" style="text-align:center">
                ኢሜይልዎን ያስገቡ — password reset link እንልካለን
            </p>

            <!-- Feedback -->
            <div id="errorMsg"   style="display:none;color:#e74c3c;background:#fadbd8;padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.9rem"></div>
            <div id="successMsg" style="display:none;background:rgba(39,174,96,0.1);border:1px solid #27ae60;color:#27ae60;padding:16px;border-radius:10px;margin-bottom:16px;font-size:0.9rem"></div>

            <!-- Form -->
            <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <label for="identifier">Email Address</label>
                    <input
                        type="email"
                        id="identifier"
                        required
                        placeholder="your@email.com"
                        autocomplete="email"
                        style="font-size:1rem"
                    >
                    <small style="display:block;margin-top:6px;color:var(--text-secondary);font-size:0.78rem">
                        📧 ምዝገባ ሲያደርጉ የተጠቀሙት ኢሜይል ያስፈልጋል
                    </small>
                </div>

                <button type="submit" class="btn btn-large btn-block" id="sendBtn">
                    📧 Send Reset Link
                </button>
            </form>

            <div style="text-align:center;margin-top:20px">
                <a href="auth-login.html" class="link" style="font-size:0.88rem">
                    ← ወደ Login ተመለስ
                </a>
            </div>

        </div>
    </div>

    <script src="theme.js"></script>
    <script src="api.js"></script>

    <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const identifier = document.getElementById('identifier').value.trim();
        const btn        = document.getElementById('sendBtn');
        const errDiv     = document.getElementById('errorMsg');
        const okDiv      = document.getElementById('successMsg');

        errDiv.style.display = 'none';
        okDiv.style.display  = 'none';

        if (!identifier) {
            errDiv.textContent   = 'ኢሜይልዎን ያስፈልጋሉ።';
            errDiv.style.display = 'block';
            return;
        }

        btn.disabled    = true;
        btn.textContent = '⏳ Sending...';

        try {
            const res = await api.request('/auth/forgot-password', {
                method: 'POST',
                body: JSON.stringify({ email: identifier })
            });

            if (res.success) {
                // Hide form, show success
                document.getElementById('forgotForm').style.display = 'none';
                okDiv.innerHTML = `
                    <div style="text-align:center">
                        <div style="font-size:2.5rem;margin-bottom:8px">📧</div>
                        <strong>Reset link ተልኳል!</strong><br>
                        <span style="font-size:0.85rem;opacity:0.85">
                            ወደ <strong>${identifier}</strong> ኢሜይሉን ይፈልጉ።<br>
                            Link 1 ሰዓት ውስጥ ያልፋል።
                        </span>
                        <div style="margin-top:14px">
                            <a href="auth-login.html"
                                style="display:inline-block;background:linear-gradient(135deg,#667eea,#764ba2);
                                color:white;padding:10px 24px;border-radius:8px;text-decoration:none;
                                font-weight:700;font-size:0.9rem">
                                ← ወደ Login ሂዱ
                            </a>
                        </div>
                    </div>`;
                okDiv.style.display = 'block';
            } else {
                errDiv.textContent   = res.message || 'ስህተት ተፈጥሯል። ደግሞ ይሞክሩ።';
                errDiv.style.display = 'block';
                btn.disabled    = false;
                btn.textContent = '📧 Send Reset Link';
            }
        } catch {
            errDiv.textContent   = 'Network ችግር አለ። ደግሞ ይሞክሩ።';
            errDiv.style.display = 'block';
            btn.disabled    = false;
            btn.textContent = '📧 Send Reset Link';
        }
    });
    </script>

    <script src="pwa.js"></script>
</body>
</html>
