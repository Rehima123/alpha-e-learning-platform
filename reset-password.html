<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Alpha Freshman Tutorial</title>
    <link rel="stylesheet" href="elearning.css">
    <meta name="theme-color" content="#3B82F6">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="home.html" class="logo-container">
                <span class="platform-name">Alpha Freshman Tutorial</span>
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card" style="max-width:420px">

            <div style="text-align:center;margin-bottom:16px">
                <div style="font-size:3.5rem" id="pageIcon">🔑</div>
            </div>

            <h2 id="pageTitle" style="text-align:center">Reset Password</h2>
            <p class="auth-subtitle" id="pageSubtitle" style="text-align:center">
                አዲስ password ያስገቡ
            </p>

            <!-- Feedback -->
            <div id="errorMsg"   style="display:none;color:#e74c3c;background:#fadbd8;padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.9rem"></div>
            <div id="successMsg" style="display:none;background:rgba(39,174,96,0.1);border:1px solid #27ae60;padding:16px;border-radius:10px;margin-bottom:16px;font-size:0.9rem"></div>

            <!-- Form (hidden when invalid token) -->
            <form id="resetForm" class="auth-form">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div style="position:relative">
                        <input
                            type="password"
                            id="newPassword"
                            required
                            placeholder="ቢያንስ 6 ቁምፊ"
                            autocomplete="new-password"
                            style="font-size:1rem;padding-right:44px">
                        <button type="button"
                            onclick="togglePwd('newPassword','eye1')"
                            id="eye1"
                            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);
                            background:none;border:none;cursor:pointer;font-size:1.1rem;padding:0"
                            aria-label="Show/hide">👁️</button>
                    </div>
                    <!-- Password strength bar -->
                    <div style="margin-top:8px">
                        <div style="height:4px;background:#eee;border-radius:4px;overflow:hidden">
                            <div id="strengthBar" style="height:100%;width:0;transition:all 0.3s;border-radius:4px"></div>
                        </div>
                        <span id="strengthText" style="font-size:0.75rem;margin-top:4px;display:block"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div style="position:relative">
                        <input
                            type="password"
                            id="confirmPassword"
                            required
                            placeholder="Password ደግሞ ይጻፉ"
                            autocomplete="new-password"
                            style="font-size:1rem;padding-right:44px">
                        <button type="button"
                            onclick="togglePwd('confirmPassword','eye2')"
                            id="eye2"
                            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);
                            background:none;border:none;cursor:pointer;font-size:1.1rem;padding:0"
                            aria-label="Show/hide">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-large btn-block" id="resetBtn">
                    ✅ Reset Password
                </button>
            </form>

            <div style="text-align:center;margin-top:20px">
                <a href="auth-login.html" class="link" style="font-size:0.88rem">← ወደ Login ተመለስ</a>
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="api.js"></script>

    <script>
    // ── Toggle password visibility ─────────────────────────────────────────────
    function togglePwd(inputId, btnId) {
        const input = document.getElementById(inputId);
        const btn   = document.getElementById(btnId);
        input.type  = input.type === 'password' ? 'text' : 'password';
        btn.textContent = input.type === 'password' ? '👁️' : '🙈';
    }

    // ── Password strength ──────────────────────────────────────────────────────
    document.getElementById('newPassword').addEventListener('input', (e) => {
        const val = e.target.value;
        const bar = document.getElementById('strengthBar');
        const txt = document.getElementById('strengthText');
        let s = 0;
        if (val.length >= 6)          s++;
        if (val.length >= 10)         s++;
        if (/[A-Z]/.test(val))        s++;
        if (/[0-9]/.test(val))        s++;
        if (/[^A-Za-z0-9]/.test(val)) s++;
        const levels = ['','Very Weak','Weak','Fair','Good','Strong'];
        const colors = ['','#e74c3c','#e67e22','#f39c12','#2ecc71','#27ae60'];
        const widths = ['0%','20%','40%','60%','80%','100%'];
        bar.style.width      = widths[s];
        bar.style.background = colors[s];
        txt.textContent      = levels[s];
        txt.style.color      = colors[s];
    });

    // ── Extract token from URL ─────────────────────────────────────────────────
    // Supports both:
    //   /reset-password/TOKEN          (clean URL via vercel.json routing)
    //   /reset-password.html?token=TOKEN  (fallback)
    function getResetToken() {
        // Try path segment first
        const pathParts = window.location.pathname.split('/');
        const idx = pathParts.indexOf('reset-password');
        if (idx !== -1 && pathParts[idx + 1]) {
            return pathParts[idx + 1];
        }
        // Fallback: query string ?token=
        return new URLSearchParams(window.location.search).get('token');
    }

    const token = getResetToken();

    // ── If no token — show error immediately ──────────────────────────────────
    if (!token) {
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('pageIcon').textContent    = '⚠️';
        document.getElementById('pageTitle').textContent   = 'Invalid Link';
        document.getElementById('pageSubtitle').textContent = '';
        const errDiv = document.getElementById('errorMsg');
        errDiv.innerHTML = `
            ይህ link ትክክለኛ አይደለም ወይም ጊዜው አልፏል።<br>
            <a href="forgot-password.html"
                style="color:#667eea;font-weight:700;text-decoration:underline;margin-top:6px;display:inline-block">
                🔗 አዲስ Reset Link ጠይቁ
            </a>`;
        errDiv.style.display = 'block';
    }

    // ── Submit new password ────────────────────────────────────────────────────
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const newPassword     = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btn             = document.getElementById('resetBtn');
        const errDiv          = document.getElementById('errorMsg');
        const okDiv           = document.getElementById('successMsg');

        errDiv.style.display = 'none';
        okDiv.style.display  = 'none';

        if (newPassword.length < 6) {
            errDiv.textContent   = 'Password ቢያንስ 6 ቁምፊ ያስፈልጋል።';
            errDiv.style.display = 'block';
            return;
        }
        if (newPassword !== confirmPassword) {
            errDiv.textContent   = 'Passwords do not match.';
            errDiv.style.display = 'block';
            return;
        }

        btn.disabled    = true;
        btn.textContent = '⏳ Resetting...';

        try {
            const res = await api.request(`/auth/reset-password/${token}`, {
                method: 'POST',
                body:   JSON.stringify({ password: newPassword })
            });

            if (res.success) {
                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('pageIcon').textContent    = '🎉';
                document.getElementById('pageTitle').textContent   = 'Password Reset!';
                document.getElementById('pageSubtitle').textContent = '';
                okDiv.innerHTML = `
                    <div style="text-align:center">
                        <strong>Password በተሳካ ሁኔታ ተለውጧል!</strong><br>
                        <span style="font-size:0.85rem;opacity:0.85">አሁን አዲስ password ይጠቀሙ።</span>
                        <div style="margin-top:14px">
                            <a href="auth-login.html"
                                style="display:inline-block;background:linear-gradient(135deg,#667eea,#764ba2);
                                color:white;padding:10px 24px;border-radius:8px;text-decoration:none;
                                font-weight:700;font-size:0.9rem">
                                🔐 Login አድርጉ →
                            </a>
                        </div>
                    </div>`;
                okDiv.style.display = 'block';

                // Auto-redirect after 3 seconds
                setTimeout(() => window.location.href = 'auth-login.html', 3000);

            } else if (res.message?.toLowerCase().includes('invalid') ||
                       res.message?.toLowerCase().includes('expired')) {
                document.getElementById('resetForm').style.display = 'none';
                errDiv.innerHTML = `
                    Link ጊዜው አልፏል ወይም ተጠቅሞበት ነው።<br>
                    <a href="forgot-password.html"
                        style="color:#667eea;font-weight:700;text-decoration:underline;margin-top:6px;display:inline-block">
                        🔗 አዲስ Reset Link ጠይቁ
                    </a>`;
                errDiv.style.display = 'block';
            } else {
                errDiv.textContent   = res.message || 'ስህተት ተፈጥሯል።';
                errDiv.style.display = 'block';
                btn.disabled    = false;
                btn.textContent = '✅ Reset Password';
            }
        } catch {
            errDiv.textContent   = 'Network ችግር አለ። ደግሞ ይሞክሩ።';
            errDiv.style.display = 'block';
            btn.disabled    = false;
            btn.textContent = '✅ Reset Password';
        }
    });
    </script>

    <script src="pwa.js"></script>
</body>
</html>
