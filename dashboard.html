<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning - E-Learning</title>
    <link rel="stylesheet" href="elearning.css">
    <meta name="theme-color" content="#3B82F6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AlphaFT">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <link rel="apple-touch-icon" sizes="152x152" href="logo.png">
    <link rel="apple-touch-icon" sizes="120x120" href="logo.png">
    <link rel="apple-touch-icon" sizes="76x76" href="logo.png">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="home.html" class="logo-container">
                <span class="platform-name">Alpha Freshman Tutorial</span>
            </a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="dashboard.html">My Learning</a></li>
                <li><a href="study-hub.html">📚 Study Hub</a></li>
                <li><a href="department-guide.html">🎓 Departments</a></li>
                <li><a href="offline.html">📥 Offline Videos</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main style="background:#020817;min-height:80vh;padding:40px 24px 80px">
        <div style="max-width:1200px;margin:0 auto">

            <!-- Greeting Header -->
            <div style="display:flex;align-items:flex-start;justify-content:space-between;
                flex-wrap:wrap;gap:16px;margin-bottom:32px">
                <div>
                    <h2 id="dashGreeting" style="color:white;font-size:clamp(1.4rem,3vw,2rem);
                        font-weight:900;margin:0 0 6px">My Learning Dashboard</h2>
                    <p id="dashSubtitle" style="color:#64748b;font-size:0.88rem;margin:0"></p>
                </div>
                <a href="courses.html" style="padding:10px 22px;background:linear-gradient(135deg,#4f46e5,#7c3aed);
                    color:white;border-radius:14px;font-weight:700;font-size:0.85rem;
                    text-decoration:none;white-space:nowrap;flex-shrink:0">
                    + አዲስ ኮርስ
                </a>
            </div>

            <!-- Streak badge -->
            <div id="streak-badge" style="margin-bottom:20px"></div>

            <!-- Payment status banner -->
            <div id="payStatusBanner" style="margin-bottom:24px"></div>

            <!-- Stats row -->
            <div id="statsRow" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px">
                <div style="background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:20px;text-align:center">
                    <div id="stat-enrolled" style="font-size:1.8rem;font-weight:900;color:#818cf8">0</div>
                    <div style="font-size:0.75rem;color:#64748b;margin-top:4px">Enrolled</div>
                </div>
                <div style="background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:20px;text-align:center">
                    <div id="stat-completed" style="font-size:1.8rem;font-weight:900;color:#34d399">0</div>
                    <div style="font-size:0.75rem;color:#64748b;margin-top:4px">Completed</div>
                </div>
                <div style="background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:20px;text-align:center">
                    <div id="stat-progress" style="font-size:1.8rem;font-weight:900;color:#fbbf24">0%</div>
                    <div style="font-size:0.75rem;color:#64748b;margin-top:4px">Progress</div>
                </div>
                <div style="background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:20px;text-align:center">
                    <div id="stat-streak" style="font-size:1.8rem;font-weight:900;color:#fb7185">0</div>
                    <div style="font-size:0.75rem;color:#64748b;margin-top:4px">Day Streak</div>
                </div>
            </div>
            <style>
            @media(max-width:640px){ #statsRow { grid-template-columns:repeat(2,1fr); } }
            </style>

            <!-- My Courses section -->
            <h3 style="color:white;font-size:1rem;font-weight:800;margin:0 0 16px">
                📚 My Courses
            </h3>
            <div class="enrolled-courses" id="enrolledCourses"></div>

            <!-- Analytics (hidden until loaded) -->
            <div id="analytics-section" style="display:none;margin-top:32px">
                <div style="display:grid;grid-template-columns:180px 1fr;gap:20px;
                    background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:24px">
                    <canvas id="progressChart" width="160" height="160"></canvas>
                    <div>
                        <h4 style="color:white;margin:0 0 12px;font-size:0.9rem;font-weight:700">
                            🏆 Leaderboard
                        </h4>
                        <div id="leaderboard-mini"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="theme.js"></script>
    <script src="api.js"></script>
    <script src="auth-guard.js"></script>
    <script src="offline-db.js"></script>
    <script src="notifications.js"></script>
    <script src="main.js"></script>
    <script src="analytics.js"></script>
    <script src="ai-assistant.js"></script>
    <script src="dashboard.js"></script>
    <script src="navbar.js"></script>
    <div class="dev-credit">© 2026 Alpha Freshman Tutorial · Developed by <strong>Rehima Ali</strong></div>
    <script src="/pwa.js"></script>
</body>
</html>
