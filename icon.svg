<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Book shape -->
  <rect x="120" y="130" width="270" height="200" rx="12" fill="white" opacity="0.95"/>
  <rect x="120" y="130" width="8" height="200" rx="4" fill="#764ba2"/>
  <!-- Lines on book -->
  <rect x="148" y="165" width="180" height="12" rx="6" fill="#667eea" opacity="0.6"/>
  <rect x="148" y="193" width="150" height="10" rx="5" fill="#667eea" opacity="0.4"/>
  <rect x="148" y="218" width="165" height="10" rx="5" fill="#667eea" opacity="0.4"/>
  <rect x="148" y="243" width="140" height="10" rx="5" fill="#667eea" opacity="0.4"/>
  <rect x="148" y="268" width="155" height="10" rx="5" fill="#667eea" opacity="0.4"/>
  <!-- Star/graduation cap -->
  <circle cx="340" cy="320" r="68" fill="#f39c12"/>
  <rect x="310" y="295" width="60" height="10" rx="5" fill="white"/>
  <polygon points="340,265 355,290 385,290 362,307 371,333 340,316 309,333 318,307 295,290 325,290" fill="white"/>
  <!-- Alpha "A" letter -->
  <text x="130" y="430" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" opacity="0.95">α</text>
  <!-- FT text -->
  <text x="210" y="430" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" opacity="0.85">FT</text>
</svg>
