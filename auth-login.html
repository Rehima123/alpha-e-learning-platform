<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alpha Freshman Tutorial</title>
    <link rel="stylesheet" href="elearning.css">
    <meta name="theme-color" content="#3B82F6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AlphaFT">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <link rel="apple-touch-icon" sizes="152x152" href="logo.png">
    <link rel="apple-touch-icon" sizes="120x120" href="logo.png">
    <link rel="apple-touch-icon" sizes="76x76" href="logo.png">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="home.html" class="logo-container">
                <span class="platform-name">Alpha Freshman Tutorial</span>
            </a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="courses.html">Courses</a></li>
            </ul>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Login to continue your learning journey</p>
            
            <form id="loginForm" class="auth-form">
                <div id="errorMessage" style="display:none;color:#e74c3c;background:#fadbd8;padding:12px 14px;border-radius:8px;margin-bottom:15px;font-size:0.9rem"></div>
                <div id="successMessage" style="display:none;color:#27ae60;background:#d4efdf;padding:12px 14px;border-radius:8px;margin-bottom:15px;font-size:0.9rem"></div>

                <div class="form-group">
                    <label for="email">Email ወይም Phone Number</label>
                    <input type="text" id="email" required
                        placeholder="email@example.com ወይም +2519..."
                        autocomplete="username"
                        style="font-size:1rem">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position:relative">
                        <input type="password" id="password" required
                            placeholder="የይለፍ ቃልዎን ያስገቡ"
                            autocomplete="current-password"
                            style="font-size:1rem;padding-right:44px">
                        <button type="button" id="togglePwd"
                            onclick="(function(){const i=document.getElementById('password');const b=document.getElementById('togglePwd');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁️':'🙈';})()"
                            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);
                            background:none;border:none;cursor:pointer;font-size:1.1rem;padding:0"
                            aria-label="Show/hide password">👁️</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>
                    <a href="#" class="link" id="forgotPwdLink">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-large btn-block" id="loginBtn">
                    🔐 Login
                </button>

                <div class="auth-divider"><span>OR</span></div>

                <button type="button" class="btn btn-social btn-google">
                    🔍 Continue with Google
                </button>

                <p class="auth-footer">
                    Don't have an account? <a href="auth-register.html" class="link">Sign up</a>
                </p>
            </form>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="api.js"></script>
    <script src="notifications.js"></script>
    <script src="firebase-config.js"></script>
    <script src="init-admin.js"></script>
    <script src="ai-assistant.js"></script>

    <script>
        window.EMAILJS_CONFIG = {
            PUBLIC_KEY:       'YOUR_PUBLIC_KEY',
            SERVICE_ID:       'service_b17ciqo',
            WELCOME_TEMPLATE: 't41x1ab',
            ADMIN_TEMPLATE:   '76pbo61',
            ADMIN_EMAIL:      'supportalphafreshman@gmail.com'
        };
    </script>
    <script src="emailjs-service.js"></script>
    <script src="auth-login.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
